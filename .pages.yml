media:
  - name: content_images
    label: Note images
    input: images
    output: /ai-tutor/images
    rename: safe
    categories: [image]

actions:
  - name: publish-draft
    label: Publish to website
    workflow: publish-draft.yml
    ref: current
    cancelable: false
    confirm:
      title: Publish draft?
      message: This will move all saved draft changes to the public website.
      button: Publish


  - name: tutor-notes
    operations:
      delete: false
    label: Notes index
    type: file
    path: content.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Page title
        type: string
        required: true
      - name: meta
        label: Subtitle
        type: text
      - name: intro
        label: Introduction
        type: text
      - name: revised
        label: Last revised
        type: string
      - name: footer
        label: Closing thought
        type: text
      - name: topics
        label: Topics
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: title
            label: Topic title
            type: string
            required: true
          - name: description
            label: Short description
            type: text
          - name: tags
            label: Question tags
            type: string
            list: true
      - name: questions
        label: Questions
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: tag
            label: Topic tag
            type: string
            required: true
          - name: topicId
            label: Parent topic ID
            type: string
            required: true
          - name: question
            label: Question
            type: text
            required: true
          - name: contentUrl
            label: Note file
            type: string
          - name: answer
            label: Short answer paragraphs
            type: text
            list: true
          - name: links
            label: Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Link text
                type: string
              - name: url
                label: Web address
                type: string
          - name: images
            label: Images
            type: image
            options:
              media: content_images
              multiple:
                max: 12
              extensions: [jpg, jpeg, png, webp, gif]
              rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Add {path}"
      update: "Update {path}"
      delete: "Delete {path}"
